name: Golden replays

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  golden:
    name: test:golden
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Golden replays
        run: npm run test:golden
